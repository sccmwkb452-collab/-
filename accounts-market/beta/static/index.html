<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shop Beta</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --bubble: #181c26; --mine: #2b3b7a; --line: #232838;
    --text: #e8ecf8; --muted: #8a93ad; --accent: #3b6cff; --violet: #8b5cf6; --cyan: #22d3ee;
    --ok: #10b981; --danger: #ef4444; --btn: #1e2433; --btn-hover: #262d40;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column;
    background: radial-gradient(1200px 500px at 90% -10%, rgba(59,108,255,.18), transparent 60%),
                radial-gradient(900px 400px at -10% 110%, rgba(139,92,246,.16), transparent 60%), var(--bg);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(18,21,28,.92);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--violet)); font-size: 20px; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-size: 16px; }
  .title span { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px;
    background: rgba(251,191,36,.15); color: #fbbf24; border: 1px solid rgba(251,191,36,.35); }
  .tools { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: rgba(18,21,28,.7); flex-wrap: wrap; }
  .tools button { background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .tools button.on { background: rgba(139,92,246,.25); border-color: var(--violet); }
  #feed { flex: 1; overflow-y: auto; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; align-self: flex-start; }
  .msg.mine { align-self: flex-end; }
  .bubble { background: var(--bubble); border: 1px solid var(--line); border-radius: 16px 16px 16px 6px; overflow: hidden; }
  .mine .bubble { background: var(--mine); border-color: transparent; border-radius: 16px 16px 6px 16px; }
  .bubble img { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; background: #1a1f2b; }
  .missing { aspect-ratio: 2 / 1; display: grid; place-items: center; color: var(--muted); background: #1a1f2b; }
  .text { padding: 9px 12px 10px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .text:empty { display: none; }
  .text code, .text pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    background: rgba(255,255,255,.06); border-radius: 6px; }
  .text code { padding: 1px 5px; }
  .text pre { padding: 8px 10px; margin: 4px 0; white-space: pre-wrap; }
  .text blockquote { margin: 4px 0; padding: 4px 10px; border-left: 3px solid var(--accent); background: rgba(59,108,255,.08); border-radius: 4px; }
  .text a { color: var(--cyan); }
  .kb { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .row { display: flex; gap: 4px; }
  .row button { flex: 1; min-width: 0; padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--btn); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button:hover { background: var(--btn-hover); }
  .row button.primary { background: rgba(59,108,255,.28); border-color: rgba(59,108,255,.6); }
  .row button.success { background: rgba(16,185,129,.24); border-color: rgba(16,185,129,.6); }
  .row button.danger { background: rgba(239,68,68,.22); border-color: rgba(239,68,68,.6); }
  .row button .ext { opacity: .6; font-size: 11px; margin-left: 4px; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  input { flex: 1; min-width: 0; background: var(--bubble); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  form button { background: linear-gradient(135deg, var(--accent), var(--violet)); color: #fff; border: 0;
    border-radius: 12px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(92vw, 480px);
    background: rgba(24,28,38,.97); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.alert { border-color: var(--accent); }
  .busy { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">⚡</div>
    <div class="title"><b>Shop Beta</b><span>предпросмотр бота · демо-данные</span></div>
    <span class="badge">BETA</span>
  </header>
  <div class="tools">
    <button id="admin" type="button">🛠 Режим администратора</button>
    <button id="reset" type="button">↺ Новый пользователь</button>
  </div>
  <div id="feed" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Сообщение или команда (/start, /admin)…" maxlength="2000">
    <button type="submit">➤</button>
  </form>
</div>
<div id="toast" role="status"></div>
<script>
const feed = document.getElementById("feed");
const toast = document.getElementById("toast");
const adminBtn = document.getElementById("admin");
let lastJson = "", busy = false, toastTimer = null;

// Bot messages use Telegram's HTML subset; anything else is dropped.
const ALLOWED = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "BLOCKQUOTE", "A", "BR", "SPAN", "TG-SPOILER"]);
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const walk = (node) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 1) {
        if (!ALLOWED.has(child.tagName)) { child.replaceWith(document.createTextNode(child.textContent)); continue; }
        for (const attr of [...child.attributes]) {
          const okHref = child.tagName === "A" && attr.name === "href" && /^(https?:|tg:)/i.test(attr.value);
          if (!okHref) child.removeAttribute(attr.name);
        }
        if (child.tagName === "A") { child.target = "_blank"; child.rel = "noopener noreferrer"; }
        walk(child);
      } else if (child.nodeType !== 3) child.remove();
    }
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}

function showToast(text, alert) {
  toast.textContent = text; toast.className = "show" + (alert ? " alert" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.className = "", alert ? 3500 : 1800);
}

function render(state) {
  adminBtn.classList.toggle("on", state.admin);
  for (const t of state.toasts) showToast(t.text, t.alert);
  const json = JSON.stringify(state.messages);
  if (json === lastJson) return;
  const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  lastJson = json; feed.innerHTML = "";
  for (const m of state.messages) {
    const wrap = document.createElement("div"); wrap.className = "msg" + (m.mine ? " mine" : "");
    const bubble = document.createElement("div"); bubble.className = "bubble";
    if (m.photo === "missing") { const d = document.createElement("div"); d.className = "missing"; d.textContent = "🖼 фото"; bubble.append(d); }
    else if (m.photo) { const img = new Image(); img.src = m.photo; img.alt = ""; img.loading = "lazy"; bubble.append(img); }
    const text = document.createElement("div"); text.className = "text";
    if (m.mine) text.textContent = m.html; else text.innerHTML = sanitize(m.html);
    bubble.append(text); wrap.append(bubble);
    if (m.buttons.length) {
      const kb = document.createElement("div"); kb.className = "kb";
      for (const row of m.buttons) {
        const r = document.createElement("div"); r.className = "row";
        for (const b of row) {
          const el = document.createElement("button"); el.type = "button"; el.textContent = b.text;
          if (b.style) el.classList.add(b.style);
          if (b.url) { const s = document.createElement("span"); s.className = "ext"; s.textContent = "↗"; el.append(s);
            el.onclick = () => window.open(b.url, "_blank", "noopener"); }
          else if (b.copy !== null && b.copy !== undefined) el.onclick = async () => {
            try { await navigator.clipboard.writeText(b.copy); showToast("Скопировано"); } catch { showToast(b.copy, true); } };
          else if (b.data) el.onclick = () => act({ type: "press", id: m.id, data: b.data });
          r.append(el);
        }
        kb.append(r);
      }
      wrap.append(kb);
    }
    feed.append(wrap);
  }
  if (stick || busy) feed.scrollTop = feed.scrollHeight;
}

async function call(url, body) {
  const res = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function act(body) {
  if (busy) return; busy = true; document.body.classList.add("busy");
  try { render(await call("api/action", body)); } catch (e) { showToast("Ошибка: " + e.message, true); }
  finally { busy = false; document.body.classList.remove("busy"); feed.scrollTop = feed.scrollHeight; }
}
document.getElementById("form").onsubmit = (e) => {
  e.preventDefault(); const input = document.getElementById("input");
  if (input.value.trim()) { act({ type: "text", text: input.value }); input.value = ""; }
};
adminBtn.onclick = () => act({ type: "admin", on: !adminBtn.classList.contains("on") });
document.getElementById("reset").onclick = () => act({ type: "reset" });

async function poll() {
  if (!busy) { try { render(await call("api/state")); } catch {} }
  setTimeout(poll, 2500);
}
call("api/state").then((s) => { render(s); feed.scrollTop = feed.scrollHeight; }).finally(() => setTimeout(poll, 2500));
</script>
</body>
</html>
