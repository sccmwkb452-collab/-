# Local development infrastructure only (PostgreSQL + Redis on localhost).
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stars
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: stars
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devpg:/var/lib/postgresql/data
      - ./deploy/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  devpg:
