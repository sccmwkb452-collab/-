# Production stack. All settings come from .env (see .env.example).
#   docker compose up -d --build
# Services restart automatically (restart: unless-stopped) and come back
# after a reboot as long as the Docker service is enabled.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  image: starshop-backend:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    PUBLIC_BASE_URL: https://${DOMAIN}
    APP_ENV: production
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "300", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # One-shot: applies database migrations before the app starts.
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m starshop.cli seed"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "starshop.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: https://${DOMAIN}
      APP_ENV: production
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 90 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *backend
    command: ["python", "-m", "starshop.bot"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    image: starshop-web:latest
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
