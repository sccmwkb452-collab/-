<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark light" />
    <title>Pulsar — Telegram Stars</title>
    <meta name="description" content="Покупка Telegram Stars для себя или в подарок" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Official Telegram Mini Apps SDK: must load before the app. -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  </head>
  <body>
    <!-- Shown until the app starts (React replaces it). Pure HTML/CSS: if the
         scripts cannot load, the hint appears instead of a blank screen. -->
    <div id="root">
      <style>
        .boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#07080c;color:#9ba4ba;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:0 32px}
        .boot i{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#2f6bff,#38bdf8);animation:bootp 1.4s ease-in-out infinite}
        .boot p{max-width:280px;margin:0;opacity:0;animation:bootr .4s 12s forwards}
        @keyframes bootp{50%{transform:scale(.9);opacity:.7}}
        @keyframes bootr{to{opacity:1}}
      </style>
      <div class="boot"><i></i><p>Магазин загружается дольше обычного. Проверьте интернет и откройте его заново.</p></div>
    </div>
    <noscript>Для работы магазина включите JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
