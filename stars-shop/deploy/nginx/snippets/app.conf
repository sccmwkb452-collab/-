# Application routes, included by the HTTP and HTTPS server blocks.
client_max_body_size 1m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

include /etc/nginx/snippets/security-headers.conf;

set $api_upstream http://api:8000;
set $bot_upstream http://bot:8081;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

location /api/v1/webhooks/ {
    limit_req zone=hooks burst=100 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

# Telegram updates when BOT_MODE=webhook (the bot checks the secret token header).
location = /tg/webhook {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $bot_upstream;
}

location /admin/assets/ {
    alias /usr/share/nginx/admin/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location /admin/ {
    alias /usr/share/nginx/admin/;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/security-headers.conf;
}

location = /admin {
    return 301 /admin/;
}

location /assets/ {
    root /usr/share/nginx/webapp;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location / {
    root /usr/share/nginx/webapp;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
