[project]
name = "nft-gift-bot"
version = "0.1.0"
description = "Telegram NFT Gift Manager bot: TON subscriptions and owner-confirmed gift transfers via Telegram Business"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
