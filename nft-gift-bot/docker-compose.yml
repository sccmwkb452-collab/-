version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - nft_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nft_gifts}
      POSTGRES_USER: ${POSTGRES_USER:-nft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nft_user} -d ${POSTGRES_DB:-nft_gifts}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nft_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nft_net

  # Запускать вручную: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nft_net
    profiles:
      - tools

volumes:
  pg_data:
  redis_data:

networks:
  nft_net:
    driver: bridge
